name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Audio Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          # ffprobe идёт в пакете ffmpeg; загрузка валидируется им (fail-closed, B8)
          ffprobe -version

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.29"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Format Check with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Validate OpenAPI Specification
        run: uv run --with openapi-spec-validator python -c "import openapi_spec_validator, yaml; openapi_spec_validator.validate(yaml.safe_load(open('openapi.yaml'))); print('OpenAPI spec is valid!')"

      - name: Validate JSON Schema
        run: uv run python -c "import jsonschema, json; jsonschema.Draft202012Validator.check_schema(json.load(open('schemas/analysis_schema_v1.json'))); print('JSON schema is valid!')"

      - name: Run Test Suite
        run: uv run --with pytest --with pytest-asyncio pytest tests/ -v
        env:
          APP_ENV: development
          DEV_TOKEN: dev-token

      - name: Download CAM++ Neural Model for Diarization
        run: uv run python scripts/download_models.py

      - name: Run Quality & Performance Evaluation Harness
        run: uv run python -m evaluation.run
        env:
          APP_ENV: development
          DEV_TOKEN: dev-token
          VOICE_SEARCH_MODEL_NAME: base

      - name: Detect Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
