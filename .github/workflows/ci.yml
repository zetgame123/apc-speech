name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Audio Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Test Suite
        run: uv run --with pytest --with pytest-asyncio pytest tests/ -v

      - name: Run Quality & Performance Evaluation Harness
        run: uv run python -m evaluation.run

      - name: Detect Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
