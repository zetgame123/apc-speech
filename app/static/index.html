<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APC-SPEECH | Outdoor Advertising Call Analytics</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Wavesurfer.js -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header-bar { background-color: #1a1e29; color: white; padding: 1rem 2rem; }
    .card-metric { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    
    .chat-container {
      height: 400px; overflow-y: auto; padding: 1rem;
      background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .msg-bubble { margin-bottom: 1rem; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
    .msg-manager { background-color: #e3f2fd; border-bottom-left-radius: 2px; margin-right: auto; }
    .msg-client { background-color: #f1f8e9; border-bottom-right-radius: 2px; margin-left: auto; text-align: right; }
    
    .speaker-badge { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: block; }
    
    .word-span { cursor: pointer; transition: background-color 0.1s; padding: 2px 0; border-radius: 4px; }
    .word-span:hover { background-color: #ffe0b2; }
    .word-active { background-color: #ffb74d; color: #000; font-weight: 500; }

    #waveform { width: 100%; height: 80px; background: #e9ecef; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>

<div class="header-bar d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-3">
    <h4 class="mb-0 fw-bold">APC-Speech <span class="text-primary">Analytics</span></h4>
    <span class="badge bg-success px-3 py-2">Profile: Small (2 vCPU)</span>
  </div>
  <div>
    <input type="text" id="apiToken" class="form-control form-control-sm" placeholder="Bearer Token (e.g. dev-token)" value="dev-token" style="width: 200px;">
  </div>
</div>

<div class="container-fluid py-4 px-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="card card-metric p-4">
        <div class="d-flex gap-3 align-items-center mb-3">
          <input type="file" id="audioFile" class="form-control" accept="audio/*" style="max-width: 300px;">
          <button id="btnUpload" class="btn btn-primary">📤 Загрузить файл</button>
          <span>или</span>
          <button id="btnRecord" class="btn btn-danger">🎤 Записать с микрофона</button>
          <span id="statusText" class="ms-3 text-muted fw-bold"></span>
        </div>
        
        <!-- Wavesurfer container -->
        <div id="waveform"></div>
        <audio id="audioPlayer" class="d-none"></audio>
        <div class="d-flex justify-content-center gap-2">
            <button id="btnPlayPause" class="btn btn-outline-dark btn-sm" disabled>▶️ Play / Pause</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Chat Section -->
    <div class="col-lg-7 mb-4">
      <h5 class="fw-bold mb-3">Транскрипция & Диаризация</h5>
      <div class="chat-container" id="chatBox">
        <div class="text-muted text-center mt-5">Загрузите или запишите аудио для получения результата</div>
      </div>
    </div>

    <!-- Analytics Section -->
    <div class="col-lg-5">
      <h5 class="fw-bold mb-3">AI Анализ звонка (Rule-based / LLM)</h5>

      <!-- Summary & Entities -->
      <div class="card card-metric p-3 mb-3">
        <h6 class="fw-bold text-primary">Саммари</h6>
        <p class="small mb-3" id="summaryText">Нет данных</p>

        <h6 class="fw-bold">Извлеченные сущности</h6>
        <div class="d-flex flex-wrap gap-1 mb-2" id="entitiesBox">
          <span class="text-muted small">Нет данных</span>
        </div>
      </div>

      <!-- Manager Quality Checklist -->
      <div class="card card-metric p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0">Чек-лист качества менеджера</h6>
          <span class="badge bg-secondary fs-6" id="checklistScore">Оценка: - / 5</span>
        </div>
        <ul class="list-group list-group-flush small" id="checklistUl">
          <!-- Populated dynamically -->
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  let wavesurfer = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let currentAudioUrl = null;
  let pollInterval = null;

  const btnUpload = document.getElementById('btnUpload');
  const btnRecord = document.getElementById('btnRecord');
  const fileInput = document.getElementById('audioFile');
  const statusText = document.getElementById('statusText');
  const chatBox = document.getElementById('chatBox');
  const tokenInput = document.getElementById('apiToken');
  const btnPlayPause = document.getElementById('btnPlayPause');

  function initWavesurfer() {
    if (wavesurfer) wavesurfer.destroy();
    wavesurfer = WaveSurfer.create({
      container: '#waveform',
      waveColor: '#4F4A85',
      progressColor: '#383351',
      barWidth: 3,
      cursorWidth: 1,
      height: 80,
      responsive: true
    });
    
    wavesurfer.on('timeupdate', (currentTime) => {
      const allWords = document.querySelectorAll('.word-span');
      allWords.forEach(span => {
        const s = parseFloat(span.dataset.start);
        const e = parseFloat(span.dataset.end);
        if (currentTime >= s && currentTime <= e) {
          span.classList.add('word-active');
        } else {
          span.classList.remove('word-active');
        }
      });
    });

    wavesurfer.on('ready', () => {
        btnPlayPause.disabled = false;
    });
  }

  btnPlayPause.addEventListener('click', () => {
      if(wavesurfer) wavesurfer.playPause();
  });

  initWavesurfer();

  // --- RECORDING LOGIC ---
  btnRecord.addEventListener('click', async () => {
    if (isRecording) {
      mediaRecorder.stop();
      btnRecord.innerText = "🎤 Записать с микрофона";
      btnRecord.classList.replace('btn-secondary', 'btn-danger');
      isRecording = false;
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        loadAudioAndUpload(audioBlob, "recorded_audio.wav");
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.innerText = "⏹ Остановить запись...";
      btnRecord.classList.replace('btn-danger', 'btn-secondary');
      statusText.innerText = "Идёт запись...";
    } catch (err) {
      alert("Ошибка доступа к микрофону: " + err.message);
    }
  });

  // --- UPLOAD LOGIC ---
  btnUpload.addEventListener('click', () => {
    if (!fileInput.files.length) return alert("Выберите файл!");
    loadAudioAndUpload(fileInput.files[0], fileInput.files[0].name);
  });

  function loadAudioAndUpload(blob, filename) {
    if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = URL.createObjectURL(blob);
    wavesurfer.load(currentAudioUrl);
    
    const formData = new FormData();
    formData.append("file", blob, filename);
    formData.append("namespace", "dashboard_demo");

    statusText.innerText = "Загрузка на сервер...";
    
    fetch("/v1/jobs/upload", {
      method: "POST",
      headers: { "Authorization": `Bearer ${tokenInput.value}` },
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) throw new Error(data.message || data.error);
      statusText.innerText = "В очереди (анализ)...";
      pollJobStatus(data.job_id);
    })
    .catch(err => {
      statusText.innerText = "Ошибка: " + err.message;
    });
  }

  function pollJobStatus(jobId) {
    if (pollInterval) clearInterval(pollInterval);
    
    pollInterval = setInterval(() => {
      fetch(`/v1/jobs/${jobId}?namespace=dashboard_demo`, {
        headers: { "Authorization": `Bearer ${tokenInput.value}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "succeeded") {
          clearInterval(pollInterval);
          statusText.innerText = "Успешно! Загрузка результатов...";
          fetchResults(data.call_id);
        } else if (data.status === "failed") {
          clearInterval(pollInterval);
          statusText.innerText = "Ошибка анализа: " + (data.error?.message || "Неизвестно");
        } else {
          statusText.innerText = `Анализ: ${data.progress}% (${data.step || 'в процессе'})`;
        }
      });
    }, 2000);
  }

  function fetchResults(callId) {
    const headers = { "Authorization": `Bearer ${tokenInput.value}` };
    
    Promise.all([
      fetch(`/v1/calls/${callId}/transcript?namespace=dashboard_demo`, { headers }).then(r => r.json()),
      fetch(`/v1/calls/${callId}/analysis?namespace=dashboard_demo`, { headers }).then(r => r.json())
    ]).then(([transcript, analysis]) => {
      renderChat(transcript.segments);
      renderAnalysis(analysis);
      statusText.innerText = "Готово!";
    }).catch(err => {
      statusText.innerText = "Ошибка загрузки результатов";
    });
  }

  function renderChat(segments) {
    chatBox.innerHTML = '';
    if (!segments || segments.length === 0) {
      chatBox.innerHTML = '<div class="text-muted text-center mt-5">Пустая транскрипция</div>';
      return;
    }
    
    segments.forEach(seg => {
      const bubble = document.createElement('div');
      const isManager = seg.speaker_role === 'manager';
      bubble.className = `msg-bubble ${isManager ? 'msg-manager' : 'msg-client'}`;
      
      const badge = document.createElement('div');
      badge.className = `speaker-badge ${isManager ? 'text-primary' : 'text-success'}`;
      badge.innerText = `${isManager ? 'Менеджер' : 'Клиент'} (${seg.speaker_label}) [${seg.start.toFixed(1)}s]`;
      bubble.appendChild(badge);

      const textContainer = document.createElement('div');
      if (seg.words && seg.words.length > 0) {
        seg.words.forEach(w => {
          const span = document.createElement('span');
          span.className = 'word-span';
          span.innerText = w.word + ' ';
          span.dataset.start = w.start;
          span.dataset.end = w.end;
          
          span.addEventListener('click', () => {
            if(wavesurfer) {
                wavesurfer.play(w.start);
            }
          });
          textContainer.appendChild(span);
        });
      } else {
          textContainer.innerText = seg.text;
      }

      bubble.appendChild(textContainer);
      chatBox.appendChild(bubble);
    });
  }

  function renderAnalysis(analysis) {
    document.getElementById('summaryText').innerText = analysis.summary || "Нет саммари";
    
    const entBox = document.getElementById('entitiesBox');
    entBox.innerHTML = '';
    const e = analysis.entities || {};
    
    if(e.cities && e.cities.length) entBox.innerHTML += `<span class="badge bg-light text-dark border">Города: ${e.cities.join(', ')}</span>`;
    if(e.formats && e.formats.length) entBox.innerHTML += `<span class="badge bg-light text-dark border">Форматы: ${e.formats.join(', ')}</span>`;
    if(e.budget_rub) entBox.innerHTML += `<span class="badge bg-warning text-dark border">Бюджет: ${e.budget_rub} руб.</span>`;
    if(e.quantity) entBox.innerHTML += `<span class="badge bg-info text-dark border">Кол-во: ${e.quantity} шт.</span>`;
    if(!entBox.innerHTML) entBox.innerHTML = '<span class="text-muted small">Не найдено</span>';
    
    const cl = analysis.manager_checklist || {};
    const score = cl.score || 0;
    
    const scoreBadge = document.getElementById('checklistScore');
    scoreBadge.innerText = `Оценка: ${score} / 5`;
    scoreBadge.className = `badge fs-6 ${score >= 4 ? 'bg-success' : score >= 2 ? 'bg-warning' : 'bg-danger'}`;
    
    const ul = document.getElementById('checklistUl');
    ul.innerHTML = '';
    const items = [
      { name: "Приветствие", val: cl.greeting },
      { name: "Выявление потребностей", val: cl.need_identification },
      { name: "Предложение вариантов", val: cl.options_offered },
      { name: "Обозначение некст-степа", val: cl.next_step_named },
      { name: "Взятие контактов", val: cl.contacts_taken }
    ];
    
    items.forEach((item, idx) => {
      ul.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
          ${idx+1}. ${item.name}
          <span class="badge ${item.val ? 'bg-success' : 'bg-secondary'} rounded-pill">
            ${item.val ? '✓ Да' : '✗ Нет'}
          </span>
        </li>
      `;
    });
  }
</script>

</body>
</html>
