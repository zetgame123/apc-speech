version: "1.0.0"
items:
  greeting:
    title: "Приветствие и представление"
    description: "Менеджер поздоровался, назвал компанию и/или свое имя"
    weight: 1
    patterns:
      - "здравствуйте"
      - "добрый день"
      - "доброе утро"
      - "добрый вечер"
      - "приветствую"
      - "компания"
      - "меня зовут"
      - "слушаю вас"
  
  need_identification:
    title: "Выявление потребности"
    description: "Менеджер задал открытые вопросы о целях, услуге, товаре, локациях или сроках"
    weight: 1
    patterns:
      - "какой город"
      - "какие локации"
      - "на какой период"
      - "какой формат"
      - "какая аудитория"
      - "какая услуга"
      - "что вас интересует"
      - "на какое время"
      - "на какую дату"
      - "чем могу помочь"
      - "какой вопрос"
      - "какая задача"
      - "подскажите"
  
  options_offered:
    title: "Предложение вариантов"
    description: "Менеджер предложил конкретные форматы, услуги, слоты времени или варианты"
    weight: 1
    patterns:
      - "можем предложить"
      - "могу предложить"
      - "есть вариант"
      - "свободна сторона"
      - "подборка"
      - "могу записать"
      - "есть время"
      - "у нас есть"
      - "свободно"
      - "стоимость"
      - "цена составляет"
      - "подходит"
  
  next_step_named:
    title: "Обозначение следующего шага"
    description: "Менеджер зафиксировал договоренность о звонке, отправке КП, записи или встрече со сроком"
    weight: 1
    patterns:
      - "отправлю вам"
      - "согласуем"
      - "до конца дня"
      - "завтра перезвоню"
      - "подготовлю расчет"
      - "записал вас"
      - "записала вас"
      - "зафиксировал"
      - "зафиксировала"
      - "ждем вас"
      - "до встречи"
      - "договорились"
  
  contacts_taken:
    title: "Взятие контактов"
    description: "Менеджер уточнил email, телефон, имя или мессенджер для отправки материалов/связи"
    weight: 1
    patterns:
      - "электронная почта"
      - "почту"
      - "номер телефона"
      - "номер"
      - "ватсап"
      - "телеграм"
      - "как вас зовут"
      - "ваше имя"
      - "контактный"

forbidden_words:
  - "не знаю"
  - "это не мои проблемы"
  - "мне все равно"
  - "сами посмотрите на сайте"
  - "вы не понимаете"
  - "ничем не могу помочь"
