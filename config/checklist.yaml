version: "1.0.0"
items:
  greeting:
    title: "Приветствие и представление"
    description: "Менеджер поздоровался, назвал компанию и/или свое имя"
    weight: 1
    patterns:
      - "здравствуйте"
      - "добрый день"
      - "компания"
      - "меня зовут"
  
  need_identification:
    title: "Выявление потребности"
    description: "Менеджер задал открытые вопросы о целях кампании, локациях, сроках"
    weight: 1
    patterns:
      - "какой город"
      - "какие локации"
      - "на какой период"
      - "какой формат"
      - "какая аудитория"
  
  options_offered:
    title: "Предложение вариантов"
    description: "Менеджер предложил конкретные форматы, локации или свободные стороны"
    weight: 1
    patterns:
      - "можем предложить"
      - "есть вариант"
      - "свободна сторона"
      - "подборка"
  
  next_step_named:
    title: "Обозначение следующего шага"
    description: "Менеджер зафиксировал договоренность о звонке, отправке КП или встрече со сроком"
    weight: 1
    patterns:
      - "отправлю вам"
      - "согласуем"
      - "до конца дня"
      - "завтра перезвоню"
      - "подготовлю расчет"
  
  contacts_taken:
    title: "Взятие контактов"
    description: "Менеджер уточнил email, телефон или мессенджер для отправки материалов"
    weight: 1
    patterns:
      - "электронная почта"
      - "почту"
      - "номер телефона"
      - "ватсап"
      - "телеграм"

forbidden_words:
  - "не знаю"
  - "это не мои проблемы"
  - "мне все равно"
  - "сами посмотрите на сайте"
  - "вы не понимаете"
  - "ничем не могу помочь"
