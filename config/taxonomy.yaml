version: "1.0.0"
categories:
  pricing:
    title: "Стоимость и прайс"
    description: "Вопросы о стоимости размещения, прайс-листах, скидках, ценообразовании"
    keywords: ["цена", "прайс", "стоимость", "скидка", "расценки", "тариф", "бюджет"]
  
  availability:
    title: "Занятость и свободные периоды"
    description: "Проверка доступности поверхностей, свободных дат и месяцев. Отличие от подбора: спрашивают ПРО конкретный формат/дату («свободен ли»), а не просят найти варианты. Отличие от прочего: есть вопрос про даты/занятость."
    keywords: ["свободно", "свободен", "свободна", "свободны", "свободный", "свободные", "занято", "доступно", "календарь", "окно", "с какого числа"]
  
  inventory_search:
    title: "Подбор мест и инвентаря"
    description: "Клиент ПРОСИТ НАЙТИ варианты (подбор, поиск, предложить места). Отличие от партнёрства: ищет клиент для себя, а не владелец предлагает свой инвентарь. Упоминание форматов менеджером в ответе подбором не считается."
    keywords: ["подбор", "подобрать", "подберите", "сторона а", "сторона б", "щит", "суперсайт", "билборд", "район", "улица", "шоссе"]
  
  specs:
    title: "Технические требования"
    description: "Требования к макетам, технические параметры конструкций, сроки подачи материалов"
    keywords: ["макет", "требования", "разрешение", "формат файла", "техтребования", "пиксели", "дедлайн"]
  
  order_status:
    title: "Статус заказа и брони"
    description: "Уточнение статуса бронирования, оплаты, прохождения согласований"
    keywords: ["статус", "бронь", "подтверждение", "прошел ли заказ", "согласование"]
  
  production:
    title: "Производство и монтаж"
    description: "Печать постеров, монтажные работы, демонтаж, фотоотчеты"
    keywords: ["печать", "монтаж", "демонтаж", "баннер", "поклейка", "фотоотчет"]
  
  documents_billing:
    title: "Документы и бухгалтерия"
    description: "Договоры, счета, закрывающие акты, сверка взаиморасчетов"
    keywords: ["договор", "счет", "акт", "бухгалтерия", "оплата", "реквизиты", "закрывающие"]
  
  complaint:
    title: "Претензии и проблемы"
    description: "Жалобы на повреждение конструкции, отсутствие подсветки, срыв сроков монтажа, требование замены. Отличие от производства: речь о ПРОБЛЕМЕ и претензии, а не о заказе печати/монтажа."
    keywords: ["претензия", "жалоба", "выцвел", "замен", "не горит", "порван", "не смонтировали", "ошибка", "срыв"]
  
  partnership_supply:
    title: "Сотрудничество и инвентарь партнеров"
    description: "Владельцы конструкций предлагают СВОЙ инвентарь для подключения к платформе. Отличие от подбора: предлагает владелец (сдать, владельцы), а не ищет клиент."
    keywords: ["свои щиты", "владельцы", "сдать", "инвентарь", "партнерство", "подключить инвентарь", "собственник", "аренда земли"]
  
  programmatic_digital:
    title: "Диджитал и программатик"
    description: "Размещение на цифровых экранах (DOOH), программатик-закупки, OTS, GRP"
    keywords: ["диджитал", "экран", "программатик", "dooh", "ots", "grp", "показы", "эфир"]
  
  spam_irrelevant:
    title: "Спам и нецелевые звонки"
    description: "Ошиблись номером, холодные спам-продажи, автоответчики"
    keywords: ["ошиблись", "предлагаем кредит", "автоответчик", "робот"]
  
  other:
    title: "Прочее"
    description: "Общие вопросы без запроса подбора, цены, дат или услуги («просто узнаю, что у вас есть»). Упоминание форматов менеджером в ответе — НЕ подбор."
    keywords: ["просто узнаю", "что у вас есть", "в общих чертах", "интересуюсь", "спрашивайте"]
