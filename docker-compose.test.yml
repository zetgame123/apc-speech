# Тестовый оверрайд для сквозной проверки callback (C9).
# НЕ для продакшена. Использование:
#   docker compose -p apc_small -f docker-compose.yml -f docker-compose.bench-small.yml \
#     -f docker-compose.test.yml up -d callback-receiver
# Приёмник живёт в изолированной сети backend (без egress) — worker-callback
# доставляет туда без выхода в интернет. Флаг CALLBACK_ALLOW_PRIVATE_NET
# разрешает приватные адреса ТОЛЬКО для callback; в production старте
# сервис с включённым флагом отказывается запускаться (см. enforce-проверку).
services:
  callback-receiver:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    command: python /app/scripts/callback_test_receiver.py
    networks:
      - backend
    environment:
      - CALLBACK_SIGNING_SECRET=${CALLBACK_SIGNING_SECRET:-dev-secret-change-me-in-production-32chars!!}
      - FAIL_FIRST_N=${CALLBACK_TEST_FAIL_FIRST_N:-1}
      - PORT=8081
    volumes:
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 3
