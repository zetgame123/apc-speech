services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apc_speech
      POSTGRES_USER: ${DB_USER:-apc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apc_user} -d apc_speech"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pass}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_pass}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alembic-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-apc_user}:${DB_PASSWORD:-secure_pass}@postgres:5432/apc_speech
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      alembic-migrate: { condition: service_completed_successfully }
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-apc_user}:${DB_PASSWORD:-secure_pass}@postgres:5432/apc_speech
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - DEV_TOKEN=${DEV_TOKEN:-}
      - ASR_MODEL_NAME=${ASR_MODEL_NAME:-./models/whisper-podlodka-turbo-ct2}
      - VOICE_SEARCH_MODEL_NAME=./models/whisper-small
      - VOICE_SEARCH_BEAM_SIZE=${VOICE_SEARCH_BEAM_SIZE:-2}
      - ASR_THREADS=2
    volumes:
      - ./models:/app/models:ro
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./schemas:/app/schemas:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1280M

  worker-long:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.long_audio_processor
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      alembic-migrate: { condition: service_completed_successfully }
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-apc_user}:${DB_PASSWORD:-secure_pass}@postgres:5432/apc_speech
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - DEV_TOKEN=${DEV_TOKEN:-}
      - ASR_MODEL_NAME=${ASR_MODEL_NAME:-./models/whisper-podlodka-turbo-ct2}
      - ASR_COMPUTE_TYPE=int8
    volumes:
      - ./models:/app/models:ro
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./schemas:/app/schemas:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; my_pid = os.getpid(); pids = [p for p in os.listdir('/proc') if p.isdigit() and int(p) != my_pid]; sys.exit(0 if any(b'long_audio_processor' in open(f'/proc/{p}/cmdline', 'rb').read() and any(l.startswith('State:') and l.split()[1] in ('S', 'R', 'D') for l in open(f'/proc/{p}/status')) for p in pids if os.path.exists(f'/proc/{p}/cmdline') and os.path.exists(f'/proc/{p}/status')) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1792M

  worker-callback:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.callback_dispatcher
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      alembic-migrate: { condition: service_completed_successfully }
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-apc_user}:${DB_PASSWORD:-secure_pass}@postgres:5432/apc_speech
      - REDIS_URL=redis://redis:6379/0
      - DEV_TOKEN=${DEV_TOKEN:-}
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; my_pid = os.getpid(); pids = [p for p in os.listdir('/proc') if p.isdigit() and int(p) != my_pid]; sys.exit(0 if any(b'callback_dispatcher' in open(f'/proc/{p}/cmdline', 'rb').read() and any(l.startswith('State:') and l.split()[1] in ('S', 'R', 'D') for l in open(f'/proc/{p}/status')) for p in pids if os.path.exists(f'/proc/{p}/cmdline') and os.path.exists(f'/proc/{p}/status')) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  worker-fast:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.fast_voice_search
    restart: unless-stopped
    profiles: ["worker-fast"]
    depends_on:
      redis: { condition: service_healthy }
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEV_TOKEN=${DEV_TOKEN:-}
    volumes:
      - ./models:/app/models:ro
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; my_pid = os.getpid(); pids = [p for p in os.listdir('/proc') if p.isdigit() and int(p) != my_pid]; sys.exit(0 if any(b'fast_voice_search' in open(f'/proc/{p}/cmdline', 'rb').read() and any(l.startswith('State:') and l.split()[1] in ('S', 'R', 'D') for l in open(f'/proc/{p}/status')) for p in pids if os.path.exists(f'/proc/{p}/cmdline') and os.path.exists(f'/proc/{p}/status')) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M

  cleanup-retention:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -c "import time, subprocess; [subprocess.run(['python', 'scripts/cleanup.py']) or time.sleep(86400) for _ in iter(int, 1)]"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      alembic-migrate: { condition: service_completed_successfully }
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-apc_user}:${DB_PASSWORD:-secure_pass}@postgres:5432/apc_speech
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # Активируется только для профиля local-full: docker compose --profile local-full up
  llm-runtime:
    image: ghcr.io/ggml-org/llama.cpp:server-b3900
    restart: unless-stopped
    profiles: ["local-full"]
    command: >
      -m /models/qwen2.5-7b-instruct-q4_k_m.gguf
      --alias qwen2.5-7b-instruct
      --host 0.0.0.0 --port 8080
      -c 4096 --n-gpu-layers 0
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M

volumes:
  pgdata:
  redisdata:
  miniodata:
