services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apc_speech
      POSTGRES_USER: ${DB_USER:-apc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apc_user -d apc_speech"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pass}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_pass}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://apc_user:secure_pass@postgres:5432/apc_speech
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  worker-long:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.long_audio_processor
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://apc_user:secure_pass@postgres:5432/apc_speech
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1792M

  worker-callback:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.callback_dispatcher
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://apc_user:secure_pass@postgres:5432/apc_speech
      - REDIS_URL=redis://redis:6379/0
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  worker-fast:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.fast_voice_search
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    env_file:
      - .env.example
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Активируется только для профиля local-full: docker compose --profile local-full up
  llm-runtime:
    image: ghcr.io/ggerganov/llama.cpp:server
    restart: unless-stopped
    profiles: ["local-full"]
    command: >
      -m /models/qwen2.5-7b-instruct-q4_k_m.gguf
      --host 0.0.0.0 --port 8080
      -c 4096 --n-gpu-layers 0
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M

volumes:
  pgdata:
  redisdata:
  miniodata:
