[project]
name = "apc-speech"
version = "0.1.0"
description = "Autonomous local speech recognition, diarization, and semantic analysis service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0.0",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.3",
    "onnxruntime>=1.18.0",
    "av>=12.0.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0,<2.0.0",
    "pyyaml>=6.0.1",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "natasha>=1.6.0",
    "scikit-learn>=1.5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
